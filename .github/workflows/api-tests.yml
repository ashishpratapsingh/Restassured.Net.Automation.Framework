name: REST API Automation Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Runs nightly at 06:00 UTC
  workflow_dispatch:      # Enables manual trigger from GitHub UI
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'Staging'
        type: choice
        options:
          - Dev
          - Staging
          - Production

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    name: Execute RestAssured.Net Tests & Deploy Report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Core.sln

      - name: Build Framework & Tests
        run: dotnet build Core.sln --no-restore --configuration Release

      - name: Run RestAssured.Net Tests
        env:
          Environment__BaseUrl: ${{ inputs.environment == 'Production' && 'https://api.prod.example.com' || 'https://reqres.in' }}
        run: |
          dotnet test Core.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory TestResults
        continue-on-error: true # Guarantees report publishing step runs even if tests fail

      - name: Upload Extent HTML Report & TRX Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-execution-reports
          path: |
            TestResults/ExtentReport.html
            TestResults/*.trx
          retention-days: 14

      # ==========================================
      # GITHUB PAGES DEPLOYMENT STEPS
      # ==========================================
      - name: Prepare GitHub Pages Assets
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          # Locate ExtentReport.html and copy as index.html for direct root navigation
          find . -name "ExtentReport.html" -exec cp {} public/index.html \;

      - name: Setup Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      # ==========================================
      # PIPELINE VERIFICATION STEP
      # ==========================================
      - name: Verify Test Execution Status
        if: always()
        run: |
          # Fails the pipeline job if any test actually failed
          if grep -q 'outcome="Failed"' TestResults/*.trx; then
            echo "::error::One or more API test cases failed."
            exit 1
          else
            echo "All API test cases passed successfully."
          fi